<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>베트남 오늘의 최신 뉴스 대시보드 | Gemini MCP</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top-header">
    <div class="header-inner">
      <div class="brand">
        <span class="flag-badge">🇻🇳</span>
        <div>
          <h1>베트남 오늘의 뉴스 대시보드</h1>
          <p class="subtitle">Vietnam Real-Time News &amp; Gemini MCP Briefing</p>
        </div>
      </div>

      <div class="header-controls">
        <div id="mcpBadge" class="mcp-badge connecting">
          <span class="dot"></span>
          <span id="mcpText">Gemini MCP 확인 중...</span>
        </div>
        <button id="refreshBtn" class="btn-refresh" onclick="refreshNews()">
          <span id="refreshIcon">↻</span> 실시간 뉴스 새로고침
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- AI Briefing Card -->
    <section class="briefing-section">
      <div class="briefing-header">
        <div class="briefing-title">
          <span class="sparkle">✨</span>
          <h2>오늘의 베트남 핵심 브리핑 (Gemini MCP 연동)</h2>
        </div>
        <span id="updatedAt" class="updated-time">업데이트 확인 중...</span>
      </div>
      <p id="briefingSummary" class="briefing-summary">최신 베트남 뉴스를 불러오고 있습니다...</p>
      <ul id="briefingHighlights" class="briefing-highlights"></ul>
    </section>

    <!-- Filter & Search Bar -->
    <section class="toolbar">
      <div class="category-tabs" id="categoryTabs">
        <button class="tab active" data-cat="all">전체 (<span id="count-all">0</span>)</button>
        <button class="tab" data-cat="latest">속보·종합</button>
        <button class="tab" data-cat="economy">경제·비즈니스</button>
        <button class="tab" data-cat="hanoi">하노이·로컬</button>
        <button class="tab" data-cat="society">사회</button>
        <button class="tab" data-cat="tech">IT·과학</button>
        <button class="tab" data-cat="culture">문화·라이프</button>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="뉴스 검색 (한국어 또는 베트남어 키워드)..."
          oninput="renderArticles()"
        />
      </div>
    </section>

    <!-- News Grid -->
    <section id="newsGrid" class="news-grid">
      <div class="loading-state">뉴스 데이터를 수집하고 번역하는 중입니다...</div>
    </section>
  </main>

  <footer class="footer">
    <p>ZEROHS.COM / Made by AI Vibe Coding</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
